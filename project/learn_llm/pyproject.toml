[project]
name = "learn-llm"
version = "0.1.0"
description = "Python LLM Agent 学习空间"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.2.0",
    "notebook>=7.2.0",
]
llm = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
]
analysis = [
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]

[tool.uv]
package = false
