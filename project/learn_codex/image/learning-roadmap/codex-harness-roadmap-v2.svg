      <circle cx="28" cy="28" r="22" fill="#2563eb"/>
      <text class="stage" x="21" y="35">0</text>
      <text class="card-title" x="24" y="74">源码基线</text>
      <text class="card-text" x="24" y="106">确认 commit</text>
