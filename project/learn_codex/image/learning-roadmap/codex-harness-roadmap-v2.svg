      <circle cx="28" cy="28" r="22" fill="#4f46e5"/>
      <text class="stage" x="21" y="35">5</text>
      <text class="card-title" x="24" y="74">状态记忆</text>
      <text class="card-text" x="24" y="106">Rollout / Thread</text>
      <text class="card-text" x="24" y="132">Context / Memory</text>
    </g>
    <g transform="translate(260 264)">
      <rect class="card" x="0" y="0" width="168" height="156" rx="18" stroke="#be123c"/>
      <circle cx="28" cy="28" r="22" fill="#be123c"/>
      <text class="stage" x="21" y="35">6</text>
      <text class="card-title" x="24" y="74">扩展点</text>
      <text class="card-text" x="24" y="106">Skills / Plugins</text>
