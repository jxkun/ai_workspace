<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex Harness 学习路线全景</title>
  <desc id="desc">从源码基线到入口、运行循环、工具沙箱、协议事件、状态记忆、扩展点和案例实验的七阶段学习路线图。</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#64748b"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 44px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke-width: 2; filter: url(#cardShadow); }
      .stage { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .card-title { font: 700 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .card-text { font: 400 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .hint { font: 600 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .connector { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="96" y="84">Codex Harness 学习路线全景</text>
  <text class="subtitle" x="98" y="122">先建立地图，再跟踪一次 turn，最后进入工具、安全、状态和扩展点。</text>

  <g transform="translate(86 176)">
    <path class="connector" d="M168 112 C210 112 212 112 254 112"/>
    <path class="connector" d="M428 112 C470 112 472 112 514 112"/>
    <path class="connector" d="M688 112 C730 112 732 112 774 112"/>
    <path class="connector" d="M948 112 C1004 112 1014 184 960 214 C918 238 878 244 818 244"/>
    <path class="connector" d="M650 244 C608 244 606 244 564 244"/>
    <path class="connector" d="M396 244 C354 244 352 244 310 244"/>

    <g>
