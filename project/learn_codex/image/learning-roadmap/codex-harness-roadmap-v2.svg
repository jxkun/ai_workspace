      <circle cx="28" cy="28" r="22" fill="#d97706"/>
      <text class="stage" x="21" y="35">2</text>
      <text class="card-title" x="24" y="74">Runtime</text>
      <text class="card-text" x="24" y="106">Session / Turn</text>
