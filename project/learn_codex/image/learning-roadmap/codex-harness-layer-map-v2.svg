<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Codex Harness 四层源码地图</title>
  <desc id="desc">Codex harness 的 Entry、Core、Support、Extension 四层模型以及每层代表性源码目录。</desc>
  <defs>
    <linearGradient id="entry" x1="0" x2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="support" x1="0" x2="1">
      <stop offset="0" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="extension" x1="0" x2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#faf5ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#64748b"/>
    </marker>
    <filter id="softShadow" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 44px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .layer { stroke-width: 2; filter: url(#softShadow); }
      .layer-title { font: 800 30px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .layer-desc { font: 400 19px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .chip-text { font: 600 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .note { font: 600 19px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .connector { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="980"/>
  <text class="title" x="92" y="86">Codex Harness 四层源码地图</text>
  <text class="subtitle" x="94" y="124">不要按目录平铺读；先确认每层职责，再沿一次 turn 穿透这些层。</text>

  <g transform="translate(100 170)">
    <rect class="layer" x="0" y="0" width="1400" height="130" rx="24" fill="url(#entry)" stroke="#2563eb"/>
    <text class="layer-title" x="36" y="52">Entry</text>
    <text class="layer-desc" x="190" y="52">用户入口和客户端壳：命令行、TUI、app-server、非交互执行</text>
    <g transform="translate(190 78)">
      <rect class="chip" x="0" y="0" width="150" height="36" rx="18"/><text class="chip-text" x="18" y="24">cli/src</text>
      <rect class="chip" x="170" y="0" width="150" height="36" rx="18"/><text class="chip-text" x="188" y="24">tui/src</text>
      <rect class="chip" x="340" y="0" width="190" height="36" rx="18"/><text class="chip-text" x="358" y="24">app-server/src</text>
      <rect class="chip" x="550" y="0" width="150" height="36" rx="18"/><text class="chip-text" x="568" y="24">exec/src</text>
      <rect class="chip" x="720" y="0" width="190" height="36" rx="18"/><text class="chip-text" x="738" y="24">codex-cli/bin</text>
    </g>
  </g>

  <path class="connector" d="M800 306 V354"/>

  <g transform="translate(100 360)">
    <rect class="layer" x="0" y="0" width="1400" height="130" rx="24" fill="url(#core)" stroke="#059669"/>
    <text class="layer-title" x="36" y="52">Core</text>
    <text class="layer-desc" x="190" y="52">线程、会话、turn、模型流、工具调度、世界状态</text>
    <g transform="translate(190 78)">
      <rect class="chip" x="0" y="0" width="185" height="36" rx="18"/><text class="chip-text" x="18" y="24">core/session</text>
      <rect class="chip" x="205" y="0" width="155" height="36" rx="18"/><text class="chip-text" x="223" y="24">core/tasks</text>
      <rect class="chip" x="380" y="0" width="150" height="36" rx="18"/><text class="chip-text" x="398" y="24">core/tools</text>
      <rect class="chip" x="550" y="0" width="190" height="36" rx="18"/><text class="chip-text" x="568" y="24">thread_manager</text>
      <rect class="chip" x="760" y="0" width="170" height="36" rx="18"/><text class="chip-text" x="778" y="24">codex_thread</text>
    </g>
  </g>

  <path class="connector" d="M800 496 V544"/>

  <g transform="translate(100 550)">
    <rect class="layer" x="0" y="0" width="1400" height="130" rx="24" fill="url(#support)" stroke="#d97706"/>
    <text class="layer-title" x="36" y="52">Support</text>
    <text class="layer-desc" x="190" y="52">协议、配置、rollout、thread store、context fragments、memory</text>
    <g transform="translate(190 78)">
      <rect class="chip" x="0" y="0" width="150" height="36" rx="18"/><text class="chip-text" x="18" y="24">protocol</text>
      <rect class="chip" x="170" y="0" width="145" height="36" rx="18"/><text class="chip-text" x="188" y="24">rollout</text>
      <rect class="chip" x="335" y="0" width="175" height="36" rx="18"/><text class="chip-text" x="353" y="24">thread-store</text>
      <rect class="chip" x="530" y="0" width="220" height="36" rx="18"/><text class="chip-text" x="548" y="24">context-fragments</text>
      <rect class="chip" x="770" y="0" width="170" height="36" rx="18"/><text class="chip-text" x="788" y="24">ext/memories</text>
    </g>
  </g>

  <path class="connector" d="M800 686 V734"/>

  <g transform="translate(100 740)">
    <rect class="layer" x="0" y="0" width="1400" height="130" rx="24" fill="url(#extension)" stroke="#7c3aed"/>
    <text class="layer-title" x="36" y="52">Extension</text>
    <text class="layer-desc" x="190" y="52">工具、安全边界和可插拔能力：sandbox、apply_patch、MCP、skills、plugins、hooks</text>
    <g transform="translate(190 78)">
      <rect class="chip" x="0" y="0" width="160" height="36" rx="18"/><text class="chip-text" x="18" y="24">sandboxing</text>
      <rect class="chip" x="180" y="0" width="170" height="36" rx="18"/><text class="chip-text" x="198" y="24">apply-patch</text>
      <rect class="chip" x="370" y="0" width="120" height="36" rx="18"/><text class="chip-text" x="388" y="24">MCP</text>
      <rect class="chip" x="510" y="0" width="125" height="36" rx="18"/><text class="chip-text" x="528" y="24">skills</text>
      <rect class="chip" x="655" y="0" width="135" height="36" rx="18"/><text class="chip-text" x="673" y="24">plugins</text>
      <rect class="chip" x="810" y="0" width="115" height="36" rx="18"/><text class="chip-text" x="828" y="24">hooks</text>
    </g>
  </g>

  <text class="note" x="106" y="925">读法：从 Entry 找入口，从 Core 跟 turn，从 Support 看状态，从 Extension 看能力边界。</text>
</svg>
