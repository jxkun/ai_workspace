<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" role="img" aria-labelledby="title desc">
  <title id="title">Skills plugins MCP hooks extension flow</title>
  <desc id="desc">Extension deep dive flow showing skill selection, plugin manifests, MCP binding, hook dispatch, and connector projection.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; }
      .skill { fill: #fff1f2; stroke: #be123c; stroke-width: 1.5; rx: 8; }
      .mcp { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; rx: 8; }
      .hook { fill: #fefce8; stroke: #a16207; stroke-width: 1.5; rx: 8; }
      .core { fill: #ecfdf5; stroke: #047857; stroke-width: 1.6; rx: 8; }
      .risk { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.4; rx: 8; }
      .text { font-family: Inter, Arial, sans-serif; fill: #0f172a; font-size: 20px; }
      .small { font-family: Inter, Arial, sans-serif; fill: #334155; font-size: 15px; }
      .tiny { font-family: Inter, Arial, sans-serif; fill: #475569; font-size: 13px; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1240" height="780"/>
  <text class="text" x="54" y="52">Extension Deep Dive: 声明能力如何进入 prompt / tools / hooks</text>
  <text class="small" x="54" y="82">扩展层分为声明、选择、绑定、执行和投影；Core 最终决定哪些能力对模型可见或可调用。</text>

  <rect class="skill" x="70" y="138" width="240" height="78"/>
  <text class="text" x="102" y="172">SkillMetadata</text>
  <text class="small" x="102" y="198">policy / scope / plugin</text>
  <rect class="skill" x="370" y="138" width="240" height="78"/>
  <text class="text" x="402" y="172">Skill selection</text>
  <text class="small" x="402" y="198">structured + $mentions</text>
  <rect class="skill" x="670" y="138" width="240" height="78"/>
  <text class="text" x="702" y="172">PluginManifest</text>
  <text class="small" x="702" y="198">skills / MCP / apps / hooks</text>

  <rect class="mcp" x="156" y="332" width="260" height="78"/>
  <text class="text" x="188" y="366">McpRuntime</text>
  <text class="small" x="188" y="392">thread-owned state</text>
  <rect class="mcp" x="490" y="332" width="260" height="78"/>
  <text class="text" x="522" y="366">McpBinding</text>
  <text class="small" x="522" y="392">frozen catalog + calls</text>
  <rect class="mcp" x="824" y="332" width="260" height="78"/>
  <text class="text" x="856" y="366">PreparedMcpCall</text>
  <text class="small" x="856" y="392">permission authority</text>

  <rect class="hook" x="160" y="526" width="250" height="78"/>
  <text class="text" x="192" y="560">HookPayload</text>
  <text class="small" x="192" y="586">event + cwd + thread</text>
  <rect class="hook" x="492" y="526" width="250" height="78"/>
  <text class="text" x="524" y="560">Hook dispatcher</text>
  <text class="small" x="524" y="586">select + async/sync</text>
  <rect class="core" x="824" y="526" width="250" height="78"/>
  <text class="text" x="856" y="560">Connector projection</text>
  <text class="small" x="856" y="586">enabled / callable</text>

  <rect class="risk" x="390" y="688" width="460" height="50"/>
  <text class="small" x="424" y="720">失败边界：ambiguous skill、invalid plugin、hidden MCP tool、hook abort、policy mismatch</text>

  <path class="arrow" d="M310 177 L370 177"/>
  <path class="arrow" d="M610 177 L670 177"/>
  <path class="arrow" d="M790 216 C724 272 626 307 416 371"/>
  <path class="arrow" d="M416 371 L490 371"/>
  <path class="arrow" d="M750 371 L824 371"/>
  <path class="dash" d="M286 410 L285 526"/>
  <path class="dash" d="M954 410 L949 526"/>
  <path class="arrow" d="M410 565 L492 565"/>
  <path class="arrow" d="M742 565 L824 565"/>
  <path class="dash" d="M620 604 L620 688"/>
  <text class="tiny" x="106" y="240">declared skill</text>
  <text class="tiny" x="392" y="240">explicit/implicit selection</text>
  <text class="tiny" x="688" y="240">bundle resources</text>
  <text class="tiny" x="520" y="432">model-visible tool catalog</text>
  <text class="tiny" x="860" y="432">call authority</text>
</svg>
