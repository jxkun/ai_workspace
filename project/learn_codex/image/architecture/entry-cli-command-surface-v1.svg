<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">Codex CLI command surface</title>
  <desc id="desc">Codex CLI parses root flags, selects subcommands, applies guards, and dispatches to TUI, exec, review, app-server, or management commands.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; }
      .dispatch { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; rx: 8; }
      .runner { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; rx: 8; }
      .guard { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.4; rx: 8; }
      .text { font-family: Inter, Arial, sans-serif; fill: #0f172a; font-size: 20px; }
      .small { font-family: Inter, Arial, sans-serif; fill: #334155; font-size: 15px; }
      .tiny { font-family: Inter, Arial, sans-serif; fill: #475569; font-size: 13px; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1240" height="760"/>
  <text class="text" x="54" y="52">Entry Part: CLI command surface</text>
  <text class="small" x="54" y="82">CLI 是模式分发器：解析根选项、合并配置覆盖、执行 guard，然后进入具体 runner。</text>

  <rect class="box" x="80" y="140" width="230" height="76"/>
  <text class="text" x="110" y="174">argv</text>
  <text class="small" x="110" y="200">prompt / flags / subcommand</text>
  <rect class="dispatch" x="380" y="140" width="250" height="76"/>
  <text class="text" x="410" y="174">MultitoolCli</text>
  <text class="small" x="410" y="200">root overrides + toggles</text>
  <rect class="guard" x="700" y="140" width="270" height="76"/>
  <text class="text" x="730" y="174">Entry guards</text>
  <text class="small" x="730" y="200">remote / worktree / strict config</text>

  <rect class="runner" x="90" y="342" width="210" height="80"/>
  <text class="text" x="122" y="376">TUI runner</text>
  <text class="small" x="122" y="402">interactive default</text>
  <rect class="runner" x="370" y="342" width="210" height="80"/>
  <text class="text" x="402" y="376">exec runner</text>
  <text class="small" x="402" y="402">headless prompt/review</text>
  <rect class="runner" x="650" y="342" width="210" height="80"/>
  <text class="text" x="682" y="376">app-server</text>
  <text class="small" x="682" y="402">control plane</text>
  <rect class="runner" x="930" y="342" width="210" height="80"/>
  <text class="text" x="962" y="376">management</text>
  <text class="small" x="962" y="402">mcp / plugin / login</text>

  <rect class="box" x="250" y="560" width="300" height="78"/>
  <text class="text" x="280" y="594">ConfigBuilder</text>
  <text class="small" x="280" y="620">cwd / model / sandbox / profile</text>
  <rect class="box" x="690" y="560" width="300" height="78"/>
  <text class="text" x="720" y="594">InitialOperation</text>
  <text class="small" x="720" y="620">UserTurn / Review / Resume / Fork</text>

  <path class="arrow" d="M310 178 L380 178"/>
  <path class="arrow" d="M630 178 L700 178"/>
  <path class="arrow" d="M835 216 C756 284 494 318 195 342"/>
  <path class="arrow" d="M835 216 C776 288 606 318 475 342"/>
  <path class="arrow" d="M835 216 C824 286 774 318 755 342"/>
  <path class="arrow" d="M835 216 C900 286 1005 316 1035 342"/>
  <path class="dash" d="M475 422 L400 560"/>
  <path class="dash" d="M475 422 C590 502 696 530 840 560"/>
  <path class="dash" d="M195 422 C248 493 326 532 400 560"/>
  <text class="tiny" x="390" y="248">feature toggles become config overrides</text>
  <text class="tiny" x="720" y="248">illegal combinations stop before runner</text>
  <text class="tiny" x="370" y="662">shared runtime settings</text>
  <text class="tiny" x="742" y="662">headless initial input</text>
</svg>
