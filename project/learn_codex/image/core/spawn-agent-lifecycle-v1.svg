<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
  <title id="title">Spawn 子 agent 生命周期</title>
  <desc id="desc">展示 spawn_agent 从工具参数解析、配置继承、容量预留、fork 历史清理，到创建子线程和提交初始通信的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 40px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 400 18px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .step { fill: #ffffff; stroke: #2563eb; stroke-width: 2; filter: url(#shadow); }
      .fork { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; filter: url(#shadow); }
      .guard { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; filter: url(#shadow); }
      .done { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; filter: url(#shadow); }
      .label { font: 800 22px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 500 16px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .small { font: 500 14px Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.4; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" width="1700" height="980"/>
  <text class="title" x="80" y="76">Spawn 子 agent 生命周期</text>
  <text class="sub" x="82" y="112">关键不是起线程，而是在创建前后保持身份、权限、历史和父子通信的一致性。</text>

  <g transform="translate(90 180)">
    <rect class="step" width="250" height="140" rx="18"/>
    <text class="label" x="28" y="45">1 参数解析</text>
    <text class="text" x="28" y="82">task / message</text>
    <text class="text" x="28" y="112">role / model / fork</text>
  </g>

  <g transform="translate(430 180)">
    <rect class="step" width="250" height="140" rx="18"/>
    <text class="label" x="28" y="45">2 子配置</text>
    <text class="text" x="28" y="82">base instructions</text>
    <text class="text" x="28" y="112">role + runtime overrides</text>
  </g>

  <g transform="translate(770 180)">
    <rect class="guard" width="250" height="140" rx="18"/>
    <text class="label" x="28" y="45">3 容量预留</text>
    <text class="text" x="28" y="82">max_threads</text>
    <text class="text" x="28" y="112">nickname / path</text>
  </g>

  <g transform="translate(1110 180)">
    <rect class="fork" width="250" height="140" rx="18"/>
    <text class="label" x="28" y="45">4 fork 可选</text>
    <text class="text" x="28" y="82">flush parent rollout</text>
    <text class="text" x="28" y="112">过滤父历史</text>
  </g>

  <g transform="translate(1360 405)">
    <rect class="fork" width="250" height="170" rx="18"/>
    <text class="label" x="28" y="45">fork 清理规则</text>
    <text class="text" x="28" y="82">去掉 tool/reasoning</text>
    <text class="text" x="28" y="112">替换 developer 指令</text>
    <text class="text" x="28" y="142">清理 guardian/hints</text>
  </g>

  <g transform="translate(1110 660)">
    <rect class="done" width="250" height="140" rx="18"/>
    <text class="label" x="28" y="45">5 创建 thread</text>
    <text class="text" x="28" y="82">new / fork thread</text>
    <text class="text" x="28" y="112">继承 env / exec policy</text>
  </g>

  <g transform="translate(770 660)">
    <rect class="done" width="250" height="140" rx="18"/>
    <text class="label" x="28" y="45">6 提交首条输入</text>
    <text class="text" x="28" y="82">UserInput 或</text>
    <text class="text" x="28" y="112">InterAgentCommunication</text>
  </g>

  <g transform="translate(430 660)">
    <rect class="guard" width="250" height="140" rx="18"/>
    <text class="label" x="28" y="45">7 注册完成</text>
    <text class="text" x="28" y="82">reservation.commit</text>
    <text class="text" x="28" y="112">persist spawn edge</text>
  </g>

  <g transform="translate(90 660)">
    <rect class="done" width="250" height="140" rx="18"/>
    <text class="label" x="28" y="45">8 父侧可见</text>
    <text class="text" x="28" y="82">notify_thread_created</text>
    <text class="text" x="28" y="112">status / activity</text>
  </g>

  <path class="arrow" d="M340 250 H430"/>
  <path class="arrow" d="M680 250 H770"/>
  <path class="arrow" d="M1020 250 H1110"/>
  <path class="arrow" d="M1360 250 C1490 250 1485 340 1485 405"/>
  <path class="arrow" d="M1485 575 C1485 655 1410 730 1360 730"/>
  <path class="arrow" d="M1110 730 H1020"/>
  <path class="arrow" d="M770 730 H680"/>
  <path class="arrow" d="M430 730 H340"/>

  <rect x="90" y="405" width="570" height="170" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text class="label" x="125" y="450">失败回滚</text>
  <text class="text" x="125" y="488">SpawnReservation 未 commit 时自动释放计数与 path</text>
  <text class="text" x="125" y="520">V2 reload 校验 parent ownership 和 exec policy</text>
  <text class="text" x="125" y="552">远端环境权限变化时拒绝恢复</text>

  <rect x="770" y="405" width="420" height="170" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text class="label" x="805" y="450">输出</text>
  <text class="text" x="805" y="488">LiveAgent { thread_id, metadata, status }</text>
  <text class="text" x="805" y="520">子 agent 开始自己的 turn</text>
  <text class="text" x="805" y="552">父 agent 通过工具和事件观察</text>
</svg>
