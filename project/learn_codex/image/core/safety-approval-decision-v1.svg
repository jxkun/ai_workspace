      .node-title { font: 700 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .node-text { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.6; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text class="title" x="82" y="82">Safety Approval Decision</text>
  <text class="subtitle" x="84" y="120">Policy decides allow, prompt, deny, sandbox and retry boundaries.</text>
