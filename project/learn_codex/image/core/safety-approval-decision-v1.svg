    <text class="node-title" x="1087" y="583">Core</text>
    <text class="node-text" x="1087" y="619">owner module</text>
  </g>
  <g>
    <rect x="630" y="686" width="240" height="108" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
