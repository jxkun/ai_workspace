<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-label="Context Fragment Lifecycle">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L12,7 L2,12 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .node-title { font: 700 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .node-text { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.6; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text class="title" x="82" y="82">Context Fragment Lifecycle</text>
  <text class="subtitle" x="84" y="120">Each context item carries source, bounds, rendering, history behavior.</text>
  <path class="edge" d="M750,160 C945,160 945,269 1141,269"/>
  <path class="edge" d="M1141,269 C1189,269 1189,515 1237,515"/>
  <path class="edge" d="M1237,515 C1102,515 1102,711 967,711"/>
  <path class="edge" d="M967,711 C750,711 750,711 533,711"/>
  <path class="edge" d="M533,711 C398,711 398,515 263,515"/>
  <path class="edge" d="M359,269 C750,269 750,269 1141,269"/>
  <rect x="570" y="380" width="360" height="140" rx="26" fill="#0f172a" filter="url(#shadow)"/>
  <text x="625" y="438" style="font: 800 28px Inter, ui-sans-serif, system-ui; fill: #fff;">codex-core</text>
  <text x="610" y="476" style="font: 500 18px Inter, ui-sans-serif, system-ui; fill: #dbeafe;">runtime kernel / event loop</text>
  <g>
    <rect x="630" y="106" width="240" height="108" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="654" y="148">Source</text>
    <text class="node-text" x="654" y="184">env/rules/tool</text>
  </g>
  <g>
    <rect x="1021" y="215" width="240" height="108" rx="20" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="1045" y="257">Fragment</text>
    <text class="node-text" x="1045" y="293">typed item</text>
  </g>
  <g>
    <rect x="1117" y="461" width="240" height="108" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="1141" y="503">Render</text>
    <text class="node-text" x="1141" y="539">ResponseItem</text>
  </g>
  <g>
    <rect x="847" y="657" width="240" height="108" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="871" y="699">WorldState Hash</text>
    <text class="node-text" x="871" y="735">diff check</text>
  </g>
  <g>
    <rect x="413" y="657" width="240" height="108" rx="20" fill="#ffffff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="437" y="699">History</text>
    <text class="node-text" x="437" y="735">retained item</text>
  </g>
  <g>
    <rect x="143" y="461" width="240" height="108" rx="20" fill="#ffffff" stroke="#be123c" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="167" y="503">Prompt</text>
    <text class="node-text" x="167" y="539">next request</text>
  </g>
  <g>
    <rect x="239" y="215" width="240" height="108" rx="20" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="263" y="257">Tests</text>
    <text class="node-text" x="263" y="293">snapshot proof</text>
  </g>
</svg>
