<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100" role="img" aria-labelledby="title desc">
  <title id="title">Codex Core 模块文档规划地图</title>
  <desc id="desc">将 codex-rs/core/src 模块按主生命周期、上下文、工具、安全、扩展、持久化、审查、实时和支撑工具分组。</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 44px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .center { fill: #0f172a; filter: url(#shadow); }
      .center-title { font: 800 31px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .center-text { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dbeafe; }
      .card { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .card-title { font: 800 23px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .card-text { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.8; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" width="1700" height="1100"/>
  <text class="title" x="88" y="86">Codex Core 模块文档规划地图</text>
  <text class="subtitle" x="90" y="124">不是逐文件背诵，而是把 core/src/lib.rs 的模块映射到可学习、可复设计的专题。</text>

  <rect class="center" x="630" y="420" width="440" height="180" rx="28"/>
  <text class="center-title" x="705" y="488">codex-core</text>
  <text class="center-text" x="690" y="530">Thread / Session / Turn</text>
  <text class="center-text" x="703" y="562">Model + Tool Runtime</text>

  <path class="connector" d="M650 448 C510 372 410 330 310 280"/>
  <path class="connector" d="M630 505 C500 505 420 505 315 505"/>
  <path class="connector" d="M650 570 C510 642 405 695 310 770"/>
  <path class="connector" d="M850 420 C850 320 850 260 850 200"/>
  <path class="connector" d="M1050 448 C1190 372 1290 330 1390 280"/>
  <path class="connector" d="M1070 505 C1200 505 1280 505 1385 505"/>
  <path class="connector" d="M1050 570 C1190 642 1295 695 1390 770"/>
  <path class="connector" d="M850 600 C850 710 850 790 850 900"/>

  <g transform="translate(85 170)">
    <rect class="card" x="0" y="0" width="360" height="150" rx="22" stroke="#2563eb"/>
    <text class="card-title" x="28" y="44">01 门面与线程入口</text>
    <text class="card-text" x="28" y="78">lib / ThreadManager</text>
    <text class="card-text" x="28" y="106">CodexThread / startup</text>
    <text class="small" x="28" y="132">先确定 core 对外边界</text>
  </g>

  <g transform="translate(85 430)">
    <rect class="card" x="0" y="0" width="360" height="150" rx="22" stroke="#059669"/>
    <text class="card-title" x="28" y="44">02 Session 与 Turn</text>
    <text class="card-text" x="28" y="78">session / tasks / state</text>
    <text class="card-text" x="28" y="106">run_turn / input queue</text>
    <text class="small" x="28" y="132">主循环和状态机</text>
  </g>

  <g transform="translate(85 700)">
    <rect class="card" x="0" y="0" width="360" height="150" rx="22" stroke="#7c3aed"/>
    <text class="card-title" x="28" y="44">03 Context 与 WorldState</text>
    <text class="card-text" x="28" y="78">context / context_manager</text>
    <text class="card-text" x="28" y="106">AGENTS / skills / fragments</text>
    <text class="small" x="28" y="132">模型到底看见什么</text>
  </g>

  <g transform="translate(660 40)">
    <rect class="card" x="0" y="0" width="380" height="150" rx="22" stroke="#d97706"/>
    <text class="card-title" x="28" y="44">04 配置与模型请求</text>
    <text class="card-text" x="28" y="78">config / env / client</text>
    <text class="card-text" x="28" y="106">responses retry / metadata</text>
    <text class="small" x="28" y="132">运行参数如何进入 turn</text>
  </g>

  <g transform="translate(1255 170)">
    <rect class="card" x="0" y="0" width="360" height="150" rx="22" stroke="#0891b2"/>
    <text class="card-title" x="28" y="44">05 Tool Runtime</text>
    <text class="card-text" x="28" y="78">registry / router / handlers</text>
    <text class="card-text" x="28" y="106">function_tool / events</text>
    <text class="small" x="28" y="132">模型如何驱动外部动作</text>
  </g>

  <g transform="translate(1255 430)">
    <rect class="card" x="0" y="0" width="360" height="150" rx="22" stroke="#be123c"/>
    <text class="card-title" x="28" y="44">06 执行与安全边界</text>
    <text class="card-text" x="28" y="78">exec / unified_exec / shell</text>
    <text class="card-text" x="28" y="106">safety / sandbox / approval</text>
    <text class="small" x="28" y="132">为什么不能随便执行</text>
  </g>

  <g transform="translate(1255 700)">
    <rect class="card" x="0" y="0" width="360" height="150" rx="22" stroke="#4f46e5"/>
    <text class="card-title" x="28" y="44">07 扩展与协作</text>
    <text class="card-text" x="28" y="78">MCP / plugins / skills</text>
    <text class="card-text" x="28" y="106">agents / spawn / guardian</text>
    <text class="small" x="28" y="132">外部能力和多 agent</text>
  </g>

  <g transform="translate(640 890)">
    <rect class="card" x="0" y="0" width="420" height="150" rx="22" stroke="#334155"/>
    <text class="card-title" x="28" y="44">08 持久化、实时与支撑</text>
    <text class="card-text" x="28" y="78">rollout / compact / resume</text>
    <text class="card-text" x="28" y="106">realtime / media / utilities</text>
    <text class="small" x="28" y="132">长期运行和边缘能力</text>
  </g>
</svg>
