<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-label="Core Crate Boundary">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L12,7 L2,12 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .node-title { font: 700 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .node-text { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.6; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text class="title" x="82" y="82">Core Crate Boundary</text>
  <text class="subtitle" x="84" y="120">Public API stays small; internal modules own the runtime details.</text>
  <path class="edge" d="M750,160 C927,160 927,245 1104,245"/>
  <path class="edge" d="M1104,245 C1177,245 1177,450 1250,450"/>
  <path class="edge" d="M1250,450 C1177,450 1177,655 1104,655"/>
  <path class="edge" d="M1104,655 C927,655 927,740 750,740"/>
  <path class="edge" d="M1104,655 C750,655 750,655 396,655"/>
  <path class="edge" d="M1104,655 C677,655 677,450 250,450"/>
  <path class="edge" d="M396,245 C750,245 750,655 1104,655"/>
  <rect x="570" y="380" width="360" height="140" rx="26" fill="#0f172a" filter="url(#shadow)"/>
  <text x="625" y="438" style="font: 800 28px Inter, ui-sans-serif, system-ui; fill: #fff;">codex-core</text>
  <text x="610" y="476" style="font: 500 18px Inter, ui-sans-serif, system-ui; fill: #dbeafe;">runtime kernel / event loop</text>
  <g>
    <rect x="630" y="106" width="240" height="108" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="654" y="148">CLI/TUI/App Server</text>
    <text class="node-text" x="654" y="184">entry crates</text>
  </g>
  <g>
    <rect x="984" y="191" width="240" height="108" rx="20" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="1008" y="233">ThreadManager</text>
    <text class="node-text" x="1008" y="269">public facade</text>
  </g>
  <g>
    <rect x="1130" y="396" width="240" height="108" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="1154" y="438">CodexThread</text>
    <text class="node-text" x="1154" y="474">thread handle</text>
  </g>
  <g>
    <rect x="984" y="601" width="240" height="108" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="1008" y="643">Session</text>
    <text class="node-text" x="1008" y="679">private runtime</text>
  </g>
  <g>
    <rect x="630" y="686" width="240" height="108" rx="20" fill="#ffffff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="654" y="728">Protocol</text>
    <text class="node-text" x="654" y="764">shared contract</text>
  </g>
  <g>
    <rect x="276" y="601" width="240" height="108" rx="20" fill="#ffffff" stroke="#be123c" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="300" y="643">Tools/Sandbox</text>
    <text class="node-text" x="300" y="679">action boundary</text>
  </g>
  <g>
    <rect x="130" y="396" width="240" height="108" rx="20" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="154" y="438">Rollout/State</text>
    <text class="node-text" x="154" y="474">persistence</text>
  </g>
  <g>
    <rect x="276" y="191" width="240" height="108" rx="20" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text class="node-title" x="300" y="233">Extensions</text>
    <text class="node-text" x="300" y="269">plugins/mcp/skills</text>
  </g>
</svg>
